name: Slides rendern

on:
  push:
    paths:
      - 'queue/**.json'
      - 'render.py'
      - 'render_reel.py'
      - 'hintergrund.py'
      - 'stimme.py'
      - 'musik.py'
      - 'backgrounds/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schriften installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-ebgaramond

      - name: ffmpeg sicherstellen
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y -qq ffmpeg

      - name: Python-Pakete installieren
        run: pip install --quiet Pillow numpy scipy piper-tts

      - name: Stimmmodell aus dem Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: stimmen
          key: piper-de_DE-thorsten-medium-v1

      - name: Rendern
        env:
          # Optional. Greift nur bei der blinden Suche ueber "motiv"; normalerweise
          # steht in der Queue-Datei ein ausgesuchtes "bild" und es braucht keinen.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 render.py --alle

      - name: Ergebnis committen
        run: |
          git config user.name "shortheaven3-bot"
          git config user.email "actions@github.com"
          git add images schedule.json
          # videos/ existiert erst, wenn das erste Reel gerendert wurde
          [ -d videos ] && git add videos || true
          # backgrounds/ haelt die geholten Motivbilder fest, damit ein zweiter
          # Lauf nichts neu holt und das Reel reproduzierbar bleibt
          [ -d backgrounds ] && git add backgrounds || true
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Beitrag gerendert und Plan aktualisiert"
            git push
          fi

      - name: Fehlschlag melden
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Lauf fehlgeschlagen: ${{ github.workflow }}" \
            --body "Der Lauf ist fehlgeschlagen. Protokoll: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
