name: Slides rendern

on:
  push:
    paths:
      - 'queue/**.json'
      - 'render.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schriften installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-ebgaramond

      - name: Pillow installieren
        run: pip install --quiet Pillow

      - name: Rendern
        run: python3 render.py --alle

      - name: Ergebnis committen
        run: |
          git config user.name "shortheaven3-bot"
          git config user.email "actions@github.com"
          git add images schedule.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Slides gerendert und Plan aktualisiert"
            git push
          fi
